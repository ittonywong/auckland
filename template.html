.langw .lcode{display:inline-flex;align-items:center;gap:.2rem;font-size:.8rem;font-weight:700;border:1px solid #fff;border-radius:1rem;padding:.1rem .4rem;line-height:1.2;white-space:nowrap;background:rgba(255,255,255,.12)}
.langw .lcode svg{width:.85rem;height:.85rem}

.langw:focus-within .lcode{outline:3px solid #7dd3fc;outline-offset:2px}
.sr{position:absolute;left:-9999px}
.card[data-stop],.card[data-fav]{cursor:pointer;-webkit-tap-highlight-color:transparent}
.card[data-stop]:active,.card[data-fav]:active{background:#eef5fa}

.dbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}

.map-panel{border-radius:10px;overflow:hidden;background:#d9e6f0;box-shadow:0 1px 3px #0002;position:relative;margin-top:8px}

.geo-msg{font-size:.8rem;color:#555;padding:6px 10px;min-height:1.2em}
.geo-msg.err{color:#8a4b00}
.geo-msg.loading::before{content:"";display:inline-block;width:.7em;height:.7em;margin-right:.4em;border:2px solid #00548f;border-top-color:transparent;border-radius:50%;vertical-align:-1px}
.map-missing{padding:24px 12px;text-align:center;color:#666;font-size:.9em}
.leaflet-container{font:inherit}
.mk-stop,.mk-me{display:block;width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px #0005}
.mk-stop{background:#00548f}
.mk-me{background:#2e7d32}
@media (prefers-reduced-motion:no-preference){
.map-panel.enter{animation:mapIn .35s ease-out both}
@keyframes mapIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mk-stop.pop{animation:stopPop .45s ease-out both}
@keyframes stopPop{0%{transform:scale(0)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
.mk-me.pulse{animation:mePulse 2.2s ease-in-out infinite}
@keyframes mePulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.82}}
.geo-msg.fade{animation:fadeIn .3s ease-out both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.geo-msg.loading::before{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
}
@media (prefers-reduced-motion:reduce){
.map-panel.enter{opacity:1}
.mk-stop.pop,.mk-me.pulse{animation:none}
.geo-msg.loading::before{animation:none;opacity:.6}
}

async function get(p){if(!CONFIGURED)throw new Error(T("errConfig"));let r;try{r=await fetch(API+p,{credentials:"omit",cache:"default"})}catch(e){throw new Error(T("errNet"));}
 if(r.status===429)throw new Error(T("errRate"));if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}
// NZ time helpers
const fmt=new Intl.DateTimeFormat("en-NZ",{timeZone:"Pacific/Auckland",hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
function nzParts(ms){const o={};for(const p of fmt.formatToParts(new Date(ms)))o[p.type]=p.value;return o;}
function nzStr(sec){const o=nzParts(sec*1000);return `${o.year}-${o.month}-${o.day} ${o.hour}:${o.minute}:${o.second}`;}
function hm(sec){const o=nzParts(sec*1000);return o.hour+":"+o.minute;}
function base(d){const y=+d.slice(0,4),m=+d.slice(4,6),dd=+d.slice(6,8);const noon=Date.UTC(y,m-1,dd,12);const o=nzParts(noon);
 const off=Date.UTC(+o.year,+o.month-1,+o.day,+o.hour,+o.minute)-noon;return (noon-off)/1000-43200;}
function ymd(ms){const o=nzParts(ms);return o.year+o.month+o.day;}

let feed=null,feedTs=0,fetchedAt=0;
async function loadFeed(){const j=await get("realtime/legacy/tripupdates");feed=j.response.entity.filter(e=>e.trip_update&&!e.is_deleted).map(e=>e.trip_update);feedTs=j.response.header.timestamp;fetchedAt=Date.now()/1000;}
// generic ETA: st=[[seq,stop_id,sec]], tu realtime or null（同一站出現多次，例如環線，取第一個未過嘅）
function eta(st,date,tu,stopId,now){for(const t of st){if(t[1]!==stopId)continue;const r=eta1(st,t,date,tu,now);if(r)return r;}return null;}
function eta1(st,t,date,tu,now){const sched=base(date)+t[2];
 if(!tu)return sched>=now-60?{t:sched,rt:false,sched}:null;
 const u=tu.stop_time_update||{};const ev=u.arrival||u.departure||{};const delay=ev.delay??tu.delay??0;
 const useq=u.stop_sequence??0;let e;const first=Math.min(...st.map(x=>x[0]));
 if(useq<=first&&delay<0)return sched>=now-60?{t:sched,rt:true,delay:0,sched,wait:true}:null; // 未開出：唔會早過時間表開
 if(t[0]<useq)return null;
 if(t[0]===useq&&ev.time)e=ev.time;else e=sched+delay;
 if(e<now-60)return null;return {t:e,rt:true,delay,sched};}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function chip(x,now){const m=Math.max(0,Math.round((x.t-now)/60));const d=x.wait?T("wait"):x.rt?(x.delay>60?T("late",{n:Math.round(x.delay/60)}):x.delay<-60?T("early",{n:Math.round(-x.delay/60)}):T("ontime")):"";
 return `<span class="eta ${x.rt?"rt":"sch"}">${x.rt?"🟢":"⚪"} ${m<1?T("arriving"):T("mins",{m})} (${hm(x.t)})<small>${x.rt?T("rtLbl")+d+T("sep")+hm(x.sched):T("schLbl")}</small></span>`;}
// NX1：內置時間表（快速路徑，只用於 route_id 相符時；其他路線一律即時向 AT API 查）
const NX_ID="NX1-203";
function active(sid,d){const c=NX.cal[sid];let ok=false;if(c){const wd=new Date(Date.UTC(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8))).getUTCDay();ok=c[(wd+6)%7]==="1"&&d>=c[7]&&d<=c[8];}
 for(const x of NX.cd)if(x[0]===sid&&x[1]===d)ok=x[2]==="1";return ok;}
function nxEtas(dir,stopId,now){const out=[],seen=new Set();
 for(const tu of feed){const tr=tu.trip;if(tr.route_id!==NX_ID)continue;const T=NX.trips[tr.trip_id];if(!T||T[0]!==dir)continue;seen.add(tr.trip_id+tr.start_date);
  const x=eta(T[2],tr.start_date,tu,stopId,now);if(x)out.push(x);}
 const today=ymd(now*1000),yest=ymd((now-86400)*1000);
 for(const [id,T] of Object.entries(NX.trips)){if(T[0]!==dir)continue;for(const d of [yest,today]){if(seen.has(id+d)||!active(T[1],d))continue;
  const x=eta(T[2],d,null,stopId,now);if(x&&x.t<now+3*3600)out.push(x);}}
 out.sort((a,b)=>a.t-b.t);return out.slice(0,3);}

const TYPE={2:"train",3:"bus",4:"ferry",712:"school"};
let ROUTES=null;
async function allRoutes(){if(ROUTES)return ROUTES;const c=sessionStorage.getItem("routes:v1");if(c)return ROUTES=JSON.parse(c);
 const j=await get("gtfs/v3/routes");ROUTES=j.data.map(d=>({id:d.id,short:d.attributes.route_short_name||"",long:d.attributes.route_long_name||"",type:d.attributes.route_type,agency:d.attributes.agency_id}));
 try{sessionStorage.setItem("routes:v1",JSON.stringify(ROUTES))}catch(e){}return ROUTES;}
const norm=s=>String(s||"").trim().toUpperCase().replace(/\s+/g,"");
async function resolveRoute(input){const q=norm(input);const R=await allRoutes();
 let m=R.filter(r=>norm(r.short)===q);
 if(!m.length)m=R.filter(r=>norm(r.id)===q||norm(r.id).startsWith(q+"-")||norm(r.long)===q);
 m.sort((a,b)=>(a.type===712)-(b.type===712)||a.id.localeCompare(b.id));
 const sugg=m.length?[]:R.filter(r=>q&&(norm(r.short).includes(q)||norm(r.long).includes(q))).sort((a,b)=>(a.type===712)-(b.type===712)||a.short.length-b.short.length).slice(0,10);
 return {m,sugg};}
const rLabel=r=>`${TYPE[r.type]?T(TYPE[r.type]):"🚍"} ${esc(r.short)}${r.long&&r.long!==r.short?" "+esc(r.long):""}`;
const dirName=hs=>{const p=String(hs).split(" To ");return p.length>1?p.slice(1).join(" To "):hs;};
const LCACHE={};
async function buildRoute(route){if(LCACHE[route.id])return LCACHE[route.id];const ck="rt:v2:"+route.id,c=sessionStorage.getItem(ck);if(c)return LCACHE[route.id]=JSON.parse(c);
 let L;
 if(route.id===NX_ID){L={route,nx:true,tripDir:{},dirs:{}};for(const k of Object.keys(NX.dirs))L.dirs[k]={hs:NX.dirs[k].headsign,stops:NX.dirs[k].stops,firsts:[]};}
 else{const tj=await get(`gtfs/v3/routes/${encodeURIComponent(route.id)}/trips`);if(!tj.data.length)throw new Error("NOTRIPS");
  const dirs={},tripDir={};for(const t of tj.data){const a=t.attributes;tripDir[a.trip_id]=String(a.direction_id);(dirs[a.direction_id]??={hs:{},shapes:{}});dirs[a.direction_id].hs[a.trip_headsign]=(dirs[a.direction_id].hs[a.trip_headsign]||0)+1;
   const sh=dirs[a.direction_id].shapes;sh[a.shape_id]??={tid:a.trip_id,n:0};sh[a.shape_id].n++;}
  L={route,nx:false,tripDir,dirs:{}};
  for(const [d,v] of Object.entries(dirs)){const order=[],names={},firsts=new Set();
   const shapes=Object.values(v.shapes).sort((a,b)=>b.n-a.n).slice(0,4);
   const ids={};// 同一個站號可能有唔同版本嘅 stop_id（GTFS 版本更新），以站號合併
   for(const sh of shapes){const s=await get(`gtfs/v3/trips/${encodeURIComponent(sh.tid)}/stops`);let prev=-1;if(s.data[0])firsts.add(s.data[0].id);
    for(const x of s.data){const key=x.attributes.stop_code||x.id;names[key]??=Object.assign({id:x.id},x.attributes);(ids[key]??=new Set()).add(x.id);
     let i=order.indexOf(key);if(i<0){order.splice(prev+1,0,key);i=prev+1;}prev=i;}}
   L.dirs[d]={hs:Object.entries(v.hs).sort((a,b)=>b[1]-a[1])[0][0],stops:order.map(k=>[names[k].id,names[k].stop_code,names[k].stop_name,[...ids[k]],names[k].stop_lat,names[k].stop_lon]),firsts:[...firsts]};}}
 try{sessionStorage.setItem(ck,JSON.stringify(L))}catch(e){}return LCACHE[route.id]=L;}

const tripCache={};
async function tripST(id){if(tripCache[id])return tripCache[id];const c=sessionStorage.getItem("st:"+id);if(c)return tripCache[id]=JSON.parse(c);
 const j=await get(`gtfs/v3/trips/${encodeURIComponent(id)}/stoptimes`);const v=j.data.map(x=>[x.attributes.stop_sequence,x.attributes.stop_id,x.attributes.arrival_time_seconds]);
 try{sessionStorage.setItem("st:"+id,JSON.stringify(v))}catch(e){}return tripCache[id]=v;}
async function pool(jobs,n){let i=0;await Promise.all(Array.from({length:Math.min(n,jobs.length)},async()=>{while(i<jobs.length)await jobs[i++]();}));}
const dirTripCache={};
async function dirTrips(L,d,now){const k=L.route.id+"|"+d,c=dirTripCache[k];if(c&&now-c.at<300)return c.v;
 const o=nzParts(now*1000),date=`${o.year}-${o.month}-${o.day}`,h=+o.hour,from=Math.max(0,h-3);const m=new Map();
 let okN=0,lastErr=null;
 for(const sid of L.dirs[d].firsts){let j;try{j=await get(`gtfs/v3/stops/${encodeURIComponent(sid)}/stoptrips?filter[date]=${date}&filter[start_hour]=${from}&filter[hour_range]=7`);okN++;}catch(e){lastErr=e;continue;} // 舊版本 stop_id 會 404，略過
  for(const x of j.data){const a=x.attributes;if(a.route_id!==L.route.id||String(a.direction_id)!==d)continue;const dd=a.service_date.replace(/-/g,"");
   const [hh,mm,ss]=a.departure_time.split(":").map(Number),dep=base(dd)+hh*3600+mm*60+ss;if(dep<now-3*3600||dep>now+3*3600)continue;m.set(a.trip_id+"|"+dd,{trip:a.trip_id,date:dd});}}
 if(!okN&&lastErr)throw lastErr;const v=[...m.values()];dirTripCache[k]={at:now,v};return v;}
async function routeEtas(L,d,now){const res={};
 if(L.nx){for(const s of L.dirs[d].stops)res[s[0]]=nxEtas(d,s[0],now);return res;}
 const trips=[],seen=new Set();
 for(const tu of feed){const tr=tu.trip;if(tr.route_id!==L.route.id)continue;const td=tr.direction_id!=null?String(tr.direction_id):L.tripDir[tr.trip_id];if(td!==d)continue;
  seen.add(tr.trip_id+"|"+tr.start_date);trips.push({id:tr.trip_id,date:tr.start_date,tu});}
 for(const s of await dirTrips(L,d,now))if(!seen.has(s.trip+"|"+s.date))trips.push({id:s.trip,date:s.date,tu:null});
 await pool(trips.map(t=>async()=>{try{t.st=await tripST(t.id)}catch(e){t.st=null}}),6);
 for(const s of L.dirs[d].stops){const out=[],sids=s[3]||[s[0]];for(const t of trips){if(!t.st)continue;let x=null;for(const sid of sids){x=eta(t.st,t.date,t.tu,sid,now);if(x)break;}if(x&&(x.rt||x.t<now+3*3600))out.push(x);}
  out.sort((a,b)=>a.t-b.t);res[s[0]]=out.slice(0,3);}
 return res;}

async function goRoute(input,prefId){const q=String(input||"").trim();setM("rpick",()=>"");

async function renderNX(){if(!feed||!CUR)return;const L=CUR,my=gen,now=Date.now()/1000,dir=$("dir").value,q=$("q").value.trim().toLowerCase(),only=$("sel").value;
 const st=L.dirs[dir].stops.filter(s=>(!only||s[0]===only)&&(!q||s[2].toLowerCase().includes(q)||String(s[1]).includes(q)));

 f.push({route_id:L.route.id,short:L.route.short,dir:d,hs:L.dirs[d].hs,stop:s[0],code:s[1],name:s[2],ids:s[3]||[s[0]],lat:s[4],lon:s[5]});saveFavs(f);setM(msgEl.id,()=>esc(T("saved",{r:L.route.short,s:s[2]})));renderFavs();return true;}

};
let lookup=null;
async function findRoute(prefId){const r=$("fr").value.trim();setM("fmsg",()=>T("querying"));["fd","fs","fadd"].forEach(i=>$(i).classList.add("hide"));setM("fpick",()=>"");
 if(!r){setM("fmsg",()=>T("enterRouteShort"));return;}
 try{const {m,sugg}=await resolveRoute(r);
  if(!m.length){setM("fmsg",()=>`<span class="err">${esc(T("notFound",{q:r}))}</span>${sugg.length?T("didYouMean"):""}`);setM("fpick",()=>sugg.map(x=>`<button data-rid="${esc(x.id)}">${rLabel(x)}</button>`).join(""));return;}
  const route=m.find(x=>x.id===prefId)||m[0];if(m.length>1)setM("fpick",()=>`<span data-same>${T("sameName")}</span>`+m.map(x=>`<button data-rid="${esc(x.id)}">${rLabel(x)} <small>(${esc(x.id)})</small></button>`).join(""));
  lookup=await buildRoute(route);
  $("fd").innerHTML=Object.entries(lookup.dirs).map(([d,v])=>`<option value="${d}">${esc(v.hs)}</option>`).join("");fillFS();
  ["fd","fs","fadd"].forEach(i=>$(i).classList.remove("hide"));setM("fmsg",()=>esc(T("pickDirStop",{r:route.short})));
 }catch(e){setM("fmsg",()=>`<span class="err">${e.message==="NOTRIPS"?T("noTripsShort"):esc(T("queryFail",{e:e.message}))}</span>`);}}
$("fpick").onclick=async ev=>{const b=ev.target.closest("button");if(!b)return;const r=(await allRoutes()).find(x=>x.id===b.dataset.rid);if(r){$("fr").value=r.short;findRoute(r.id);}};
function fillFS(){$("fs").innerHTML=lookup.dirs[$("fd").value].stops.map(s=>`<option value="${s[0]}">${esc(s[2])} (${esc(s[1])})</option>`).join("");}
function addFav(){const d=$("fd").value,s=lookup.dirs[d].stops.find(x=>x[0]===$("fs").value);if(s)favAdd(lookup,d,s,$("fmsg"));}
// 收藏：用 GTFS v3 stoptrips 攞該站時間表（每個收藏 5 分鐘快取一次）
const schCache={};
async function stopSched(x,now){const k=x.route_id+x.dir+x.stop;const c=schCache[k];if(c&&now-c.at<300)return c.v;
 const o=nzParts(now*1000),date=`${o.year}-${o.month}-${o.day}`,h=Math.max(0,+o.hour-1);let data=[],okN=0,lastErr=null;
 for(const sid of (x.ids||[x.stop])){try{const j=await get(`gtfs/v3/stops/${encodeURIComponent(sid)}/stoptrips?filter[date]=${date}&filter[start_hour]=${h}&filter[hour_range]=4`);data=data.concat(j.data);okN++;}catch(e){lastErr=e}}
 if(!okN&&lastErr)throw lastErr;
 const v=data.map(d=>d.attributes).filter(a=>a.route_id===x.route_id&&String(a.direction_id)===x.dir)
  .map(a=>{const [hh,mm,ss]=a.departure_time.split(":").map(Number);return {trip:a.trip_id,date:a.service_date.replace(/-/g,""),seq:a.stop_sequence,sec:hh*3600+mm*60+ss,sid:a.stop_id};});
 schCache[k]={at:now,v};return v;}
async function renderFavs(){const f=favs();if(!f.length){$("favs").innerHTML=`<div class="card meta">${T("noFavs")}</div>`;return;}if(!feed)return;
 const now=Date.now()/1000;const html=[];
 for(const [i,x] of f.entries()){let e=[],err="";
  try{if(x.route_id===NX_ID)e=nxEtas(x.dir,x.stop,now);else{
    const sch=await stopSched(x,now),seen=new Set();
    for(const tu of feed){const tr=tu.trip;if(tr.route_id!==x.route_id||String(tr.direction_id)!==x.dir)continue;seen.add(tr.trip_id+"|"+tr.start_date);
     const s=sch.find(y=>y.trip===tr.trip_id&&y.date===tr.start_date);const st=s?[[s.seq,s.sid,s.sec]]:await tripST(tr.trip_id);let r=null;for(const sid of (x.ids||[x.stop])){r=eta(st,tr.start_date,tu,sid,now);if(r)break;}if(r)e.push(r);}
    for(const s of sch){if(seen.has(s.trip+"|"+s.date))continue;const r=eta([[s.seq,s.sid,s.sec]],s.date,null,s.sid,now);if(r)e.push(r);}}
  }catch(er){err=er.message}
  e.sort((a,b)=>a.t-b.t);
  html.push(`<div class="card" data-fav="${i}"><button class="del" data-i="${i}">${T("del")}</button><div class="stop" data-raw>${esc(x.short)} · ${esc(x.name)} <span class="code">#${esc(x.code)}</span></div><div class="meta" data-raw>${esc(x.hs)}</div>${err?`<span class="err">${esc(err)}</span>`:e.length?e.slice(0,3).map(y=>chip(y,now)).join(""):`<span class="meta">${T("none3h")}</span>`}</div>`);}
 $("favs").innerHTML=html.join("");}
$("favs").onclick=ev=>{
 if(ev.target.closest(".del")){const i=ev.target.closest(".del").dataset.i;if(i!==undefined){const f=favs();f.splice(+i,1);saveFavs(f);renderFavs();}return;}
 const card=ev.target.closest(".card[data-fav]");if(!card)return;const i=+card.dataset.fav;const f=favs()[i];if(!f)return;
 const clone=card.cloneNode(true);clone.querySelectorAll(".del").forEach(x=>x.remove());
 const bits=[...clone.querySelectorAll(".eta,.meta,.err")].filter(x=>!x.classList.contains("code")).map(x=>x.outerHTML).join("");
 openStopDetail({kind:"fav",fav:f,stop:[f.stop,f.code,f.name,f.ids||[f.stop],f.lat,f.lon],etaBits:bits});
};

 catch(e){setM("upd",()=>`<span class="err">${esc(T("updFail",{e:e.message}))}</span>`);}
 await renderNX();await renderFavs();}finally{busy=false;}}
$("t1").onclick=()=>{closeStopDetail();$("t1").className="on";$("t2").className="";$("p1").classList.remove("hide");$("p2").classList.add("hide");};

 document.querySelectorAll("[data-tr]").forEach(e=>e.textContent=T(e.dataset.tr));document.querySelectorAll("[data-ip]").forEach(e=>e.placeholder=T(e.dataset.ip));
 for(const [id,fn] of Object.entries(M))$(id).innerHTML=fn();
 fillDir();fillSel();if(CUR&&feed&&$("detail").classList.contains("hide"))renderNX();if(!$("p2").classList.contains("hide")&&$("detail").classList.contains("hide"))renderFavs();else if(feed&&favs().length&&$("detail").classList.contains("hide"))renderFavs();
 if(!$("detail").classList.contains("hide")&&detailCtx){document.querySelectorAll("#detail [data-tr]").forEach(e=>e.textContent=T(e.dataset.tr));fillDetailInfo();const g=$("dgeo");if(g&&g.classList.contains("loading"))g.textContent=T("geoLoading");$("dmap").setAttribute("aria-label",T("mapAria"));}}

 if(!qp&&last){init=last.replace(/-\d+$/,"");pref=last;}

// ---- stop detail + Leaflet (one stop + user; destroy on leave) ----
let mapInst=null,detailCtx=null,geoAbort=false,coordCache={};
const reduceMotion=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function destroyMap(){
  geoAbort=true;
  if(mapInst){try{mapInst.remove()}catch(e){} mapInst=null}
  const m=$("dmap"); if(m) m.innerHTML="";
  const g=$("dgeo"); if(g){g.className="geo-msg";g.textContent=""}
  const pan=$("dmapPanel"); if(pan) pan.classList.remove("enter");
}
function closeStopDetail(){
  destroyMap(); detailCtx=null;
  $("detail").classList.add("hide");
  if($("t1").className==="on") $("p1").classList.remove("hide");
  else $("p2").classList.remove("hide");
}
function mkIcon(cls,title){
  return L.divIcon({className:"",html:'<span class="'+cls+'" title="'+esc(title)+'"></span>',iconSize:[22,22],iconAnchor:[11,11]});
}
function showGeoMsg(kind,text){
  const g=$("dgeo"); if(!g)return;
  g.className="geo-msg"+(kind==="err"?" err":"")+(kind==="loading"?" loading":"")+(reduceMotion()?"":" fade");
  g.textContent=text||"";
}
function fitOrView(map, stopLL, meLL){
  if(meLL) map.fitBounds(L.latLngBounds([stopLL,meLL]).pad(0.35));
  else map.setView(stopLL,16);
}
function fillDetailInfo(){
  if(!detailCtx)return;
  const s=detailCtx.stop;
  let head="";
  if(detailCtx.kind==="fav"){
    const f=detailCtx.fav;
    head=`<div class="stop" data-raw>${esc(f.short)} · ${esc(f.name)} <span class="code">#${esc(f.code)}</span></div><div class="meta" data-raw>${esc(f.hs)}</div>`;
  } else {
    head=`<div class="stop" data-raw>${esc(s[2])} <span class="code">#${esc(s[1])}</span></div>`;
    if(detailCtx.L) head+=`<div class="meta" data-raw>${esc(detailCtx.L.route.short)} · ${esc(T("toDir",{d:dirName(detailCtx.L.dirs[detailCtx.dir].hs)}))}</div>`;
  }
  $("dinfo").innerHTML=head+(detailCtx.etaBits||`<span class="meta">${T("noSvc")}</span>`);
}
async function resolveStopLatLon(ctx){
  const s=ctx.stop;
  let lat=s[4], lon=s[5];
  if(lat!=null&&lon!=null&&lat!==""&&lon!==""&&Number.isFinite(+lat)&&Number.isFinite(+lon)) return {lat:+lat,lon:+lon};
  const ids=s[3]||[s[0]];
  const code=s[1];
  for(const id of ids){ if(coordCache[id]) return coordCache[id]; }
  if(code!=null&&coordCache["code:"+code]) return coordCache["code:"+code];
  if(coordCache[s[0]]) return coordCache[s[0]];
  function absorb(j){
    for(const x of (j.data||[])){
      const a=x.attributes||{};
      if(a.stop_lat==null||a.stop_lon==null) continue;
      const c={lat:+a.stop_lat,lon:+a.stop_lon};
      coordCache[x.id]=c;
      if(a.stop_id) coordCache[a.stop_id]=c;
      if(a.stop_code!=null&&a.stop_code!=="") coordCache["code:"+a.stop_code]=c;
    }
  }
  function found(){
    for(const id of ids){ if(coordCache[id]) return coordCache[id]; }
    if(code!=null&&coordCache["code:"+code]) return coordCache["code:"+code];
    if(coordCache[s[0]]) return coordCache[s[0]];
    return null;
  }
  try{
    const tripIds=[];
    const dirKey=ctx.kind==="fav"?(ctx.fav&&ctx.fav.dir):ctx.dir;
    const L=ctx.L;
    if(ctx.kind==="route"&&L){
      if(L.nx){
        for(const [id,T] of Object.entries(NX.trips)){ if(String(T[0])===String(dirKey)) tripIds.push(id); if(tripIds.length>=6) break; }
      } else {
        for(const tu of (feed||[])){
          const tr=tu.trip; if(!tr||tr.route_id!==L.route.id) continue;
          const td=tr.direction_id!=null?String(tr.direction_id):L.tripDir[tr.trip_id];
          if(String(td)!==String(dirKey)) continue;
          tripIds.push(tr.trip_id); if(tripIds.length>=6) break;
        }
        if(!tripIds.length){ const now=Date.now()/1000; const trips=await dirTrips(L,dirKey,now); for(const t of trips.slice(0,6)) tripIds.push(t.trip); }
      }
    } else if(ctx.kind==="fav"&&ctx.fav){
      const f=ctx.fav;
      if(f.route_id===NX_ID){
        for(const [id,T] of Object.entries(NX.trips)){ if(String(T[0])===String(f.dir)) tripIds.push(id); if(tripIds.length>=6) break; }
      } else {
        for(const tu of (feed||[])){
          const tr=tu.trip; if(tr&&tr.route_id===f.route_id&&String(tr.direction_id)===String(f.dir)){ tripIds.push(tr.trip_id); if(tripIds.length>=6) break; }
        }
      }
    }
    for(const tripId of tripIds){
      try{ absorb(await get(`gtfs/v3/trips/${encodeURIComponent(tripId)}/stops`)); }catch(e){}
      const hit=found(); if(hit){
        if(L&&dirKey!=null&&L.dirs[dirKey]){
          for(const st of L.dirs[dirKey].stops){
            const c=coordCache[st[0]]||((st[3]||[]).map(id=>coordCache[id]).find(Boolean))||(st[1]!=null&&coordCache["code:"+st[1]]);
            if(c){ st[4]=c.lat; st[5]=c.lon; }
          }
        }
        return hit;
      }
    }
  }catch(e){}
  return found();
}
function initMapAt(lat,lng,stopLabel){
  destroyMap(); geoAbort=false;
  const el=$("dmap");
  const pan=$("dmapPanel");
  pan.classList.remove("enter"); void pan.offsetWidth; if(!reduceMotion()) pan.classList.add("enter");
  const map=L.map(el,{zoomControl:true,attributionControl:true});
  mapInst=map;
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  const stopLL=[lat,lng];
  L.marker(stopLL,{icon:mkIcon("mk-stop"+(reduceMotion()?"":" pop"),T("mapStop")),title:stopLabel||T("mapStop")}).addTo(map)
    .bindPopup(esc(stopLabel||T("mapStop")));
  fitOrView(map, stopLL, null);
  setTimeout(()=>{try{map.invalidateSize()}catch(e){}},80);
  showGeoMsg("loading", T("geoLoading"));
  if(!navigator.geolocation){showGeoMsg("err", T("geoFail")); return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    if(geoAbort||mapInst!==map)return;
    const meLL=[pos.coords.latitude, pos.coords.longitude];
    L.marker(meLL,{icon:mkIcon("mk-me"+(reduceMotion()?"":" pulse"),T("mapMe")),title:T("mapMe")}).addTo(map)
      .bindPopup(T("mapMe"));
    showGeoMsg("", "");
    fitOrView(map, stopLL, meLL);
  }, err=>{
    if(geoAbort||mapInst!==map)return;
    showGeoMsg("err", (err&&err.code===1)?T("geoDenied"):T("geoFail"));
  },{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
}
async function openStopDetail(ctx){
  detailCtx=ctx;
  // capture ETA chips HTML from card if provided via DOM
  if(ctx.kind==="route"){
    const card=document.querySelector(`.card[data-stop="${CSS.escape(ctx.stop[0])}"]`);
    if(card){ const clone=card.cloneNode(true); clone.querySelectorAll(".addf").forEach(x=>x.remove()); const bits=[...clone.querySelectorAll(".eta,.meta")].map(x=>x.outerHTML).join(""); ctx.etaBits=bits||""; }
  } else if(ctx.kind==="fav"){
    const card=document.querySelector(`.card[data-fav]`); // will refresh below
  }
  $("p1").classList.add("hide"); $("p2").classList.add("hide");
  $("detail").classList.remove("hide");
  fillDetailInfo();
  $("dmap").setAttribute("aria-label", T("mapAria"));
  destroyMap();
  const pan=$("dmapPanel");
  showGeoMsg("loading", T("geoLoading"));
  const coords=await resolveStopLatLon(ctx);
  if(!detailCtx) return; // left already
  if(!coords){
    pan.classList.remove("enter"); if(!reduceMotion()) pan.classList.add("enter");
    $("dmap").innerHTML=`<div class="map-missing">${esc(T("noCoord"))}</div>`;
    showGeoMsg("","");
    return;
  }
  // write back
  ctx.stop[4]=coords.lat; ctx.stop[5]=coords.lon;
  if(ctx.fav){ ctx.fav.lat=coords.lat; ctx.fav.lon=coords.lon; }
  if(typeof L==="undefined"){ $("dmap").innerHTML=`<div class="map-missing">Leaflet</div>`; return; }
  const label=ctx.kind==="fav"?ctx.fav.name:ctx.stop[2];
  initMapAt(coords.lat, coords.lon, label);
}
$("dback").onclick=closeStopDetail;
